<style>
  :root {
    --bg: #0b0b0a;
    --bg-2: #111110;
    --line: #262623;
    --line-hi: #4a4a44;
    --text: #ecebe6;
    --muted: #8d8c85;
    --accent: #ff6b35;          /* the only accent color — change it here */

    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    --gutter: clamp(20px, 5vw, 56px);
    --maxw: 1120px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: 72px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--accent); color: #000; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

  .mono { font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  /* ---------- top bar ---------- */
  .top { position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line); background: rgba(11,11,10,.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .top .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; }
  .top nav { display: flex; gap: 28px; }
  .top nav a { color: var(--muted); transition: color .15s; }
  .top nav a:hover { color: var(--text); }

  /* ---------- hero ---------- */
  .hero { padding: clamp(64px, 12vw, 144px) 0 clamp(56px, 9vw, 104px); }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(56px, 11vw, 148px);
    line-height: .92;
    letter-spacing: -.02em;
  }
  .hero h1 em { font-style: italic; color: var(--muted); }
  .hero .bio {
    margin-top: clamp(28px, 4vw, 48px);
    max-width: 34ch;
    font-size: clamp(20px, 2.4vw, 26px);
    line-height: 1.35;
    letter-spacing: -.01em;
  }
  .meta {
    margin-top: clamp(40px, 6vw, 72px);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    border-top: 1px solid var(--line);
  }
  .meta > div { padding: 18px 24px 18px 0; }
  .meta dt { margin-bottom: 6px; }
  .meta dd { font-size: 16px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; vertical-align: 1px;
  }

  /* ---------- hero layout + mini terminal ---------- */
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: clamp(32px, 5vw, 64px); align-items: stretch; }
  .term {
    display: flex; flex-direction: column; min-height: 320px; min-width: 0;
    border: 1px solid var(--line-hi); background: var(--bg-2);
    font: 13px/1.6 var(--mono); transition: border-color .15s;
  }
  .term:focus-within { border-color: var(--muted); }
  .term-bar { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); text-transform: none; }
  .term-out { flex: 1; overflow-y: auto; padding: 10px 12px 4px; scrollbar-width: thin; scrollbar-color: var(--line-hi) transparent; }
  .term-out div { white-space: pre-wrap; overflow-wrap: anywhere; }
  .term-out .cmd, .term-out .dim { color: var(--muted); }
  .term-out .bad { color: #e5857a; }
  .term-out a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .term-row { display: flex; gap: 8px; align-items: center; padding: 6px 12px 10px; cursor: text; }
  .term-prompt { color: var(--accent); }
  .term-row input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; caret-color: var(--accent); }
  @media (max-width: 960px) {
    .hero-grid { grid-template-columns: 1fr; align-items: start; }
    .term { height: 280px; margin-top: 36px; }
  }
  @media (max-width: 760px) { .term-row input { font-size: 16px; } }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    border: 1px solid var(--line-hi);
    font-size: 14px; font-weight: 500;
    transition: background .15s, color .15s, border-color .15s;
  }
  .btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn .arr { font-family: var(--mono); font-size: 12px; transition: transform .15s; }
  .btn:hover .arr { transform: translate(2px, -2px); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }

  /* ---------- sections ---------- */
  section { padding: clamp(56px, 8vw, 104px) 0; border-top: 1px solid var(--line); }
  .sec-head {
    display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap;
    margin-bottom: clamp(28px, 4vw, 48px);
  }
  .sec-head h2 {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(36px, 5vw, 60px); line-height: 1; letter-spacing: -.015em;
  }
  .sec-head h2 sup { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 8px; vertical-align: top; position: relative; top: .5em; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button {
    font: inherit; font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
    background: none; color: var(--muted);
    border: 1px solid var(--line); padding: 7px 12px; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .filters button:hover { color: var(--text); border-color: var(--line-hi); }
  .filters button[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }

  /* ---------- project cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .card {
    background: var(--bg);
    display: flex; flex-direction: column;
    transition: background .2s;
  }
  .card:hover { background: var(--bg-2); }
  .card.wide { grid-column: 1 / -1; }
  .card[hidden] { display: none; }

  .shot {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .card.wide .shot { aspect-ratio: 21 / 9; }
  .shot img, .shot video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot.gallery > img { object-fit: contain; }
  .shot.gallery > img, .thumb img { image-rendering: pixelated; }
  .card.wide .shot.gallery { aspect-ratio: 16 / 9; max-height: 460px; }
  .thumbs { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  .thumb {
    width: 76px; aspect-ratio: 16 / 9; padding: 0; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line-hi); opacity: .7;
    transition: opacity .15s, border-color .15s;
  }
  .thumb:hover { opacity: 1; }
  .thumb.on { opacity: 1; border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb img.broken { visibility: hidden; }
  /* when no image could be loaded: a tidy placeholder instead of broken-image icons */
  .shot.gallery.broken {
    display: grid; place-items: center;
    background: repeating-linear-gradient(135deg, transparent 0 11px, var(--line) 11px 12px), var(--bg-2);
  }
  .shot.gallery.broken > img, .shot.gallery.broken .thumbs { display: none; }
  .shot.gallery.broken::after {
    content: "screenshots could not be loaded · see the itch.io page";
    font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
    background: var(--bg); padding: 6px 12px; border: 1px solid var(--line); text-align: center; max-width: 80%;
  }
  .shot.empty {
    display: grid; place-items: center;
    background:
      repeating-linear-gradient(135deg, transparent 0 11px, var(--line) 11px 12px),
      var(--bg-2);
  }
  .shot.empty span { background: var(--bg); padding: 4px 10px; border: 1px solid var(--line); }

  .body { padding: 24px 24px 26px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .row { display: flex; justify-content: space-between; gap: 12px; }
  .card h3 {
    font-family: var(--serif); font-weight: 400;
    font-size: 32px; line-height: 1.05; letter-spacing: -.01em;
  }
  .card p { color: #b6b5ad; font-size: 16px; max-width: 52ch; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
  .tags li {
    list-style: none; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--line); padding: 3px 8px;
  }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .status-tag { color: var(--accent); }

  /* ---------- buttons as <button> ---------- */
  [hidden] { display: none !important; }
  button.btn { background: none; color: inherit; font-family: var(--sans); cursor: pointer; }
  button.btn:hover { background: var(--text); color: var(--bg); }
  button.btn:disabled { opacity: .35; pointer-events: none; }
  .btn.pri { border-color: var(--accent); color: var(--accent); }
  button.btn.pri:hover { background: var(--accent); border-color: var(--accent); color: #000; }

  /* ---------- embedded tool ---------- */
  .card:has(.embed):hover { background: var(--bg); }
  .embed { margin-top: 6px; padding-top: 16px; border-top: 1px solid var(--line); }
  .embed + .links { margin-top: 14px; }
  .tool { display: flex; flex-direction: column; gap: 10px; }
  .tool-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .tool textarea {
    width: 100%; min-height: 92px; resize: vertical;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line-hi); border-radius: 0; padding: 12px;
    font: 13px/1.5 var(--mono);
  }
  .tool textarea::placeholder { color: var(--muted); }
  .tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tool-row .sp { flex: 1; }
  .tool-row.opts { gap: 22px; color: var(--muted); font-size: 14px; }
  .tool label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
  .tool input[type=checkbox] { accent-color: var(--accent); }
  .toast { color: var(--accent); min-height: 1em; }
  .out { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); padding: 14px; }
  .out textarea { min-height: 72px; }
  .res-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    border-top: 1px solid var(--line); border-left: 1px solid var(--line);
  }
  .res { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .res-h { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); }
  .res-h .sp { flex: 1; }
  .res-h .btn { padding: 2px 9px; font-size: 12px; }
  .res-list { list-style: none; padding: 8px 12px; max-height: 128px; overflow: auto; font: 12.5px/1.55 var(--mono); }
  .res-list li { overflow-wrap: anywhere; }
  .res-list li.none { color: var(--muted); font-family: var(--sans); }
  .res.empty .res-list { opacity: .55; }

  /* ---------- embedded tool: Log Sanitizer extras ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    color: var(--muted); padding: 6px 12px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  details.settings { border: 1px solid var(--line); padding: 8px 12px; }
  details.settings summary { cursor: pointer; }
  .grp { margin: 12px 0 6px; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 16px; font-size: 14px; color: var(--muted); }
  .checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .tool .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tool .two textarea { min-height: 72px; height: 72px; }
  .tool .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tool .pane { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .tool .panes textarea, .tool .view { min-height: 130px; height: 130px; }
  .tool .view {
    width: 100%; overflow: auto; white-space: pre-wrap; word-break: break-all;
    border: 1px solid var(--line-hi); padding: 12px; font: 13px/1.5 var(--mono); color: var(--text);
  }
  .tool mark { background: rgba(255,107,53,.25); color: var(--text); padding: 0 1px; }
  .tool mark.secret { background: rgba(248,81,73,.38); }
  .stats { color: var(--muted); font-size: 13px; min-height: 1.2em; }
  .stats strong { color: var(--text); }
  .note, .card .tool p.note { color: var(--muted); font-size: 13px; line-height: 1.5; max-width: none; margin-top: 4px; }
  .err { color: #f85149; font-size: 13px; margin-top: 6px; }
  .warnbox { border: 1px solid var(--accent); color: #d9b8a8; font-size: 13px; padding: 8px 12px; }
  label.btn { cursor: pointer; }
  .card.stretch { grid-column: 1 / -1; }
  .card.stretch .shot { aspect-ratio: 21 / 9; }

  /* ---------- toolkit ---------- */
  .kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border-top: 1px solid var(--line); }
  .kit > div { padding: 24px 24px 8px 0; }
  .kit h3 { font-weight: 400; margin-bottom: 14px; }
  .kit ul { list-style: none; }
  .kit li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 16px; display: flex; justify-content: space-between; gap: 12px; }
  .kit li span { color: var(--muted); font-size: 14px; text-align: right; }
  .also { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); color: #b6b5ad; max-width: 60ch; }
  .also:empty { display: none; }

  /* ---------- contacts ---------- */
  .contacts { border-top: 1px solid var(--line); }
  .contacts a {
    display: grid; grid-template-columns: 140px 1fr auto; align-items: baseline; gap: 16px;
    padding: 20px 0; border-bottom: 1px solid var(--line);
    transition: padding .2s, color .2s;
  }
  .contacts a .val { overflow-wrap: anywhere; font-family: var(--serif); font-size: clamp(26px, 4vw, 44px); line-height: 1.1; letter-spacing: -.01em; }
  .contacts a .arr { font-family: var(--mono); color: var(--muted); transition: color .15s, transform .2s; }
  .contacts a:hover { color: var(--accent); padding-left: 10px; }
  .contacts a:hover .arr { color: var(--accent); transform: translate(2px, -2px); }

  footer { border-top: 1px solid var(--line); padding: 28px 0 40px; }
  footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  /* ---------- responsive ---------- */
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .tool .panes, .tool .two { grid-template-columns: 1fr; }

    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;

  kids.flat().forEach(k => k != null && el.append(k));

}

function loadWithFallback(img, m, onFail) {
  let triedFallback = false;
  const resolve = (s) => (s && s.startsWith("asset:")) ? ((window.ASSETS || {})[s.slice(6)] || "") : s;
  img.addEventListener("error", () => {
    if (m.fallback && !triedFallback) { triedFallback = true; img.src = resolve(m.fallback); }
    else if (onFail) onFail();
  });
  const go = () => { img.src = resolve(m.src); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
}

function shot(media, title) {
  if (Array.isArray(media) && media.length) {
    const first = media[0];
    const main = h("img", { alt: first.alt || title, referrerpolicy: "no-referrer" });
    const box = h("div", { class: "shot gallery" }, main);
    let current = first;
    loadWithFallback(main, first, () => box.classList.add("broken"));
    if (media.length > 1) {
      const bar = h("div", { class: "thumbs" });
      media.forEach((m, i) => {
        const timg = h("img", { alt: "", loading: "lazy", referrerpolicy: "no-referrer" });

        const b = h("button", { type: "button", class: "thumb" + (i === 0 ? " on" : ""), "aria-label": "Show image " + (i + 1) }, timg);

          box.classList.remove("broken");
          main.alt = m.alt || title;
          main.src = timg.currentSrc || timg.src;   // reuse whichever source worked for the thumbnail
          bar.querySelectorAll(".thumb").forEach(x => x.classList.toggle("on", x === b));
        });
        bar.append(b);
      });
      box.append(bar);
    }
    return box;
  }
  if (media && media.video) {
    return h("div", { class: "shot" }, h("video", {
      src: media.video, poster: media.poster || null,
      autoplay: true, muted: true, loop: true, playsinline: true,
      "aria-label": title,

  if (media && media.src) {
    return h("div", { class: "shot" }, h("img", {

  return h("div", { class: "shot empty" }, h("span", { class: "mono", text: "preview · 16:9" }));
}

    whoami:   ["who is this", () => say(SITE.navName + ": " + SITE.bio)],
    about:    ["status and what I am up to", () => SITE.meta.forEach(m => say(pad(m.label.toLowerCase(), 10) + m.value))],
    projects: ["list my projects", () => {
      SITE.projects.forEach(p => say("[" + (typeLabel[p.type] || p.type) + "] " + p.title + (p.status ? " (" + p.status + ")" : "")));
      say('tip: "goto projects"', "dim");
    }],
    toolkit:  ["languages and tools", () => SITE.toolkit.forEach(g => say(pad(g.group, 18) + g.items.map(i => i.name).join(", ")))],
    contact:  ["how to reach me", () => SITE.contacts.forEach(c => el("", [pad(c.label.toLowerCase(), 10), { href: c.url, text: c.value }]))],
    goto:     ["jump to a section: goto projects", (a) => {
      const t = SECTIONS[(a[0] || "").toLowerCase()];
      if (!t) return say("usage: goto projects|toolkit|contact|top", "bad");
      document.querySelector(t).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }],
    ls:       ["list files", () => say("projects/  toolkit/  contact/  readme.txt")],
    cat:      ["read a file: cat readme.txt", (a) => a[0] === "readme.txt" ? say(SITE.bio) : say("cat: " + (a[0] || "") + ": No such file or directory", "bad")],
    date:     ["current date in Baku", () => say(new Date().toLocaleString("en-GB", { timeZone: "Asia/Baku", dateStyle: "full", timeStyle: "medium" }) + " (AZT)")],
    echo:     ["print text", (a) => say(a.join(" "))],
    clear:    ["clear the screen (or Ctrl+L)", () => { out.textContent = ""; }],
    // ----- hidden -----
    pwd:   ["", () => say("/home/visitor"), true],
    cd:    ["", () => say('cd: nowhere to go. Try "goto projects".', "dim"), true],
    sudo:  ["", (a) => a.length ? sudoJoke() : say("usage: sudo <command>"), true],
    rm:    ["", (a) => {
      if (!a.length) return say("rm: missing operand", "bad");
      naughty++;
      say("rm: it is dangerous to operate recursively on '/'", "bad");
      say("rm: use --no-preserve-root to override this failsafe", "dim");
      later(() => say(naughty > 3 ? "Persistent, aren't you? Respect." : NICE[(naughty - 1) % NICE.length]), 600);
    }, true],
    vim:   ["", () => say("Ah, a person of culture. (It's Neovim here, and no, you can't exit.)"), true],
    nvim:  ["", () => say("Ah, a person of culture. You can :q, but not from here."), true],
    nmap:  ["", () => say("Scanning is fine on machines you own or have permission to test. This one is neither."), true],
    hack:  ["", () => say('Ethical only. For a legit conversation: "contact".'), true],
    exit:  ["", () => say("There is no escape. (Close the tab like everyone else.)"), true],
  };

  function run(raw) {
    const line = raw.trim();
    el("cmd", [PROMPT + raw]);
    if (!line) return;
    hist.push(line); hpos = hist.length;
    const [name, ...args] = line.split(/\s+/);
    const key = name.toLowerCase();
    if (Object.hasOwn(CMDS, key)) CMDS[key][1](args, line);
    else say("bash: " + name + ": command not found. Type 'help'.", "bad");
  }

  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { run(inp.value); inp.value = ""; }
    else if (e.key === "ArrowUp") { e.preventDefault(); if (hpos > 0) inp.value = hist[--hpos]; }
    else if (e.key === "ArrowDown") { e.preventDefault(); hpos = Math.min(hist.length, hpos + 1); inp.value = hist[hpos] || ""; }
    else if (e.key === "Tab") {
      e.preventDefault();
      const v = inp.value.trim().toLowerCase();
      if (v && !/\s/.test(v)) {
        const m = Object.keys(CMDS).filter(k => k.startsWith(v));
        if (m.length === 1) inp.value = m[0] + " ";
        else if (m.length > 1) say(m.join("  "), "dim");
      }
    }
    else if (e.key.toLowerCase() === "l" && e.ctrlKey) { e.preventDefault(); out.textContent = ""; }
  });
  box.addEventListener("click", () => { if (!getSelection().toString()) inp.focus(); });

  say('Welcome. Type "help" to see what this thing can do.', "dim");
})();

// embedded tools: each one registers a mount function in EMBEDS (see the next script)
window.EMBEDS = {};
window.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("[data-embed]").forEach(el => {
    const mount = EMBEDS[el.dataset.embed];
    if (mount) mount(el);
  });
});

<script>
/* =====================================================================
   EMBEDDED TOOL: IOC Extractor (https://github.com/ravigaming222/ioc-extractor)
   Logic is identical to the standalone ioc-extractor.html; only the UI is
   restyled and scoped to the card. Nothing here needs editing.
   ===================================================================== */

// ===== IOC-LOGIC-START (pure logic, no DOM; tested from Node) =====
const FILE_EXTS = new Set([
  "exe","dll","js","php","pdf","zip","png","jpg","jpeg","gif","bmp","svg","ico","css","html","htm",
  "txt","doc","docx","xls","xlsx","ppt","pptx","rar","7z","gz","tar","bat","cmd","ps1","vbs","jar",
  "msi","sys","lnk","iso","dat","log","tmp","bin","json","xml","csv","yml","yaml","ini","cfg","conf",
  "asp","aspx","jsp","cgi","docm","xlsm","scr","dmp","bak","swf","mp3","mp4","avi"
]);

const TYPES = ["urls","domains","ipv4","ipv6","emails","md5","sha1","sha256","cve"];

function refang(text) {
  const tt = (m) => m.replace(/x/g, "t").replace(/X/g, "T"); // keeps letter case
  return String(text)
    .replace(/\bhxxps?\b/gi, tt)
    .replace(/\bfxp\b/gi, tt)
    .replace(/\[:\/\/\]/g, "://")
    .replace(/\[:\]/g, ":")
    .replace(/\[\.\]|\(\.\)|\{\.\}|\[dot\]|\(dot\)|\{dot\}/gi, ".")
    .replace(/\[@\]|\(at\)|\[at\]/gi, "@");
}

function toIPv4Parts(ip) { return ip.split(".").map(Number); }

function isPrivateIPv4(ip) {
  const [a, b] = toIPv4Parts(ip);
  return a === 10 || a === 127 || a === 0 ||
    (a === 172 && b >= 16 && b <= 31) ||
    (a === 192 && b === 168) ||
    (a === 169 && b === 254);
}

function validIPv6(s) {
  if (!/^[0-9a-f:]+$/i.test(s) || !/[0-9a-f]/i.test(s) || s.includes(":::")) return false;
  const halves = s.split("::");
  if (halves.length > 2) return false;
  const groups = (h) => (h === "" ? [] : h.split(":"));
  const ok = (g) => g.every((x) => /^[0-9a-f]{1,4}$/i.test(x));
  if (halves.length === 2) {
    const all = groups(halves[0]).concat(groups(halves[1]));
    return all.length <= 7 && ok(all);
  }
  const all = s.split(":");
  return all.length === 8 && ok(all);
}

function trimUrl(u) {
  const pairs = { ")": "(", "]": "[", "}": "{" };
  for (;;) {
    const last = u[u.length - 1];
    if (last && ".,;:!?'\"<>*".includes(last)) { u = u.slice(0, -1); continue; }
    if (last && pairs[last]) {
      const open = u.split(pairs[last]).length - 1;
      const close = u.split(last).length - 1;
      if (close > open) { u = u.slice(0, -1); continue; }
    }
    return u;
  }
}

function urlHost(u) {
  const m = /^[a-z]+:\/\/([^\/?#]*)/i.exec(u);
  if (!m) return "";
  let h = m[1].replace(/^.*@/, "");
  if (h[0] === "[") return "";
  return h.replace(/:\d*$/, "");
}

function uniq(arr) { return Array.from(new Set(arr)); }

function extract(text, opts) {
  const o = opts || {};
  const t = refang(text);
  const res = {};
  TYPES.forEach((k) => { res[k] = []; });

  // URLs
  const urlRe = /\b(?:https?|ftp):\/\/[^\s<>"'`]+/gi;
  const urls = (t.match(urlRe) || []).map(trimUrl).filter((u) => /:\/\/./.test(u));
  res.urls = uniq(urls);

  // Emails
  const emailRe = /(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,24}(?![A-Za-z0-9-])/g;
  res.emails = uniq((t.match(emailRe) || []).map((e) => e.toLowerCase()));

  // IPv4
  const ipRe = /(?<![\w.])(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?!\d|\.\d)(?![\w])/g;
  let ips = uniq(t.match(ipRe) || []);
  if (o.hidePrivate) ips = ips.filter((ip) => !isPrivateIPv4(ip));
  res.ipv4 = ips;

  // IPv6 (simplified)
  const v6Re = /(?<![\w:.])(?:[0-9a-f]{0,4}:){2,7}[0-9a-f]{0,4}(?![\w:])/gi;
  res.ipv6 = uniq((t.match(v6Re) || []).filter(validIPv6).map((x) => x.toLowerCase()));

  // Domains: URL paths are cut off so that only hosts are scanned
  const hostText = t.replace(urlRe, (m) => " " + urlHost(trimUrl(m)) + " ");
  const domRe = /(?<![\w.-])(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+([a-z]{2,24})(?![\w-])/gi;
  const doms = [];
  let m;
  while ((m = domRe.exec(hostText))) {
    const tld = m[1].toLowerCase();
    const d = m[0].toLowerCase();
    if (/^\d+$/.test(tld) || FILE_EXTS.has(tld)) continue;
    if (/^(?:\d{1,3}\.){3}\d{1,3}$/.test(d)) continue;
    doms.push(d);
  }
  res.domains = uniq(doms);

  // Hashes (lookarounds: never cut pieces out of longer hex strings)
  const hash = (n) => uniq((t.match(new RegExp("(?<![0-9a-f])[0-9a-f]{" + n + "}(?![0-9a-f])", "gi")) || []).map((h) => h.toLowerCase()));
  res.md5 = hash(32);
  res.sha1 = hash(40);
  res.sha256 = hash(64);

  // CVE
  res.cve = uniq((t.match(/\bCVE-\d{4}-\d{4,7}\b/gi) || []).map((c) => c.toUpperCase()));
  return res;
}

function defangValue(value, type) {
  const v = String(value);
  switch (type) {
    case "urls":
      return v
        .replace(/^(?:https?|ftp)(?=:)/i, (m) => m.replace(/tt/, "xx").replace(/TT/, "XX").replace(/t/, "x").replace(/T/, "X"))
        .replace("://", "[://]")
        .replace(/\./g, "[.]");
    case "domains":
    case "ipv4":
      return v.replace(/\./g, "[.]");
    case "ipv6":
      return v.replace(/:/g, "[:]");
    case "emails":
      return v.replace(/@/g, "[@]").replace(/\./g, "[.]");
    default:
      return v;
  }
}

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&"); }

function defangText(text) {
  const t = refang(text);
  const found = extract(t, { hidePrivate: false });
  const items = [];
  ["urls", "domains", "ipv4", "ipv6", "emails"].forEach((type) => {
    found[type].forEach((value) => items.push({ value, type }));
  });
  // longest first, replaced through markers so replacements never overlap
  items.sort((a, b) => b.value.length - a.value.length);
  const repl = [];
  let out = t;
  items.forEach(({ value, type }) => {
    const body = escapeRe(value);
    const re = type === "urls"
      ? new RegExp(body, "gi")
      : new RegExp("(?<![A-Za-z0-9_-])" + body + "(?![A-Za-z0-9_-])" + (type === "ipv4" ? "(?!\\.\\d)" : ""), "gi");
    out = out.replace(re, (m) => {
      repl.push(defangValue(m, type));
      return "\u0001" + (repl.length - 1) + "\u0002";
    });
  });
  return out.replace(/\u0001(\d+)\u0002/g, (_, i) => repl[Number(i)]);
}
// ===== IOC-LOGIC-END =====

// ===== UI (scoped to one card) =====
EMBEDS.ioc = function (host) {
  host.append(document.getElementById("tpl-ioc").content.cloneNode(true));
  const q = (r) => host.querySelector('[data-r="' + r + '"]');

  const LABELS = {
    urls: "URL", domains: "Domains", ipv4: "IPv4", ipv6: "IPv6", emails: "E-mail",
    md5: "MD5", sha1: "SHA-1", sha256: "SHA-256", cve: "CVE"
  };
  const SAMPLE = [
    "Incident report (demo)",
    "",
    "The user received an email from billing-support[@]secure-mail[.]top with a link hxxps://login-update[.]example-bank[.]xyz/auth/verify.php?id=42.",
    "The loader downloaded hxxp://185[.]220[.]101[.]45:8080/payload.exe and contacted the C2 evil-cdn(.)net and 91.214.124[.]7.",
    "Internal addresses 192.168.1.15 and 10.0.0.7 are not related to the incident. IPv6 C2: 2001:db8:85a3::8a2e:370:7334.",
    "",
    "Hashes:",
    "MD5: 44d88612fea8a8f36de82e1278abb02f",
    "SHA-1: 3395856ce81f2b7382dee72602f798b642f14140",
    "SHA-256: 275a021bbfb6489e54d471899f7db9d1663fc695ec2fe2a2c4538aabf651fd0f",
    "",
    "CVE-2021-44228 (Log4Shell) is exploited, see also CVE-2023-23397.",
    "Contact: soc[at]example[dot]org"
  ].join("\n");

  const input = q("input"), grid = q("grid");
  let current = null; // { type: [values to display] }

  function compute() {
    const raw = extract(input.value, { hidePrivate: q("private").checked });
    const defanged = q("defanged").checked;
    const view = {};
    TYPES.forEach((k) => { view[k] = defanged ? raw[k].map((v) => defangValue(v, k)) : raw[k]; });
    return view;
  }

  function flash(el, msg) {
    el.textContent = msg;
    setTimeout(() => { el.textContent = ""; }, 1500);
  }

  async function copy(text, toastEl) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) { /* ignore */ }
      document.body.removeChild(ta);
    }
    flash(toastEl, "Copied");
  }

  function render() {
    current = compute();
    grid.textContent = "";
    let total = 0;
    TYPES.forEach((k) => {
      const vals = current[k];
      total += vals.length;
      const cell = document.createElement("div");
      cell.className = "res" + (vals.length ? "" : " empty");

      const head = document.createElement("div"); head.className = "res-h";
      const title = document.createElement("span"); title.className = "mono"; title.style.color = "var(--text)"; title.textContent = LABELS[k];
      const badge = document.createElement("span"); badge.className = "mono"; badge.textContent = String(vals.length);
      const sp = document.createElement("span"); sp.className = "sp";
      const toast = document.createElement("span"); toast.className = "toast mono";
      const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn sm"; btn.textContent = "Copy"; btn.disabled = !vals.length;
      btn.addEventListener("click", () => copy(vals.join("\n"), toast));
      head.append(title, badge, sp, toast, btn);

      const ul = document.createElement("ul"); ul.className = "res-list";
      if (!vals.length) {
        const li = document.createElement("li"); li.className = "none"; li.textContent = "Nothing found"; ul.appendChild(li);
      } else {
        vals.forEach((v) => { const li = document.createElement("li"); li.textContent = v; ul.appendChild(li); });
      }
      cell.append(head, ul);
      if (vals.length) grid.appendChild(cell);   // empty types are hidden to keep the tool compact
    });
    grid.hidden = total === 0;
    q("summary").textContent = "Found: " + total;
    ["csv", "json", "copyall"].forEach((r) => { q(r).disabled = total === 0; });
  }

  function csvCell(v) { return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

  function download(name, mime, content) {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function showOut(title, text) {
    q("outpanel").hidden = false;
    q("outtitle").textContent = title;
    q("outtext").value = text;
  }

  input.addEventListener("input", render);
  q("private").addEventListener("change", render);
  q("defanged").addEventListener("change", render);
  q("sample").addEventListener("click", () => { input.value = SAMPLE; render(); });
  q("clear").addEventListener("click", () => {
    input.value = ""; q("outtext").value = ""; q("outpanel").hidden = true; render();
  });
  q("defang").addEventListener("click", () => showOut("Result: defang text", defangText(input.value)));
  q("refang").addEventListener("click", () => showOut("Result: refang text", refang(input.value)));
  q("copyout").addEventListener("click", () => copy(q("outtext").value, q("toastout")));
  q("copyall").addEventListener("click", () => {
    const parts = [];
    TYPES.forEach((k) => { if (current[k].length) parts.push("# " + LABELS[k] + "\n" + current[k].join("\n")); });
    copy(parts.join("\n\n"), q("toast"));
  });
  q("csv").addEventListener("click", () => {
    const rows = ["type,value"];
    TYPES.forEach((k) => current[k].forEach((v) => rows.push(k + "," + csvCell(v))));
    download("iocs.csv", "text/csv;charset=utf-8", rows.join("\r\n") + "\r\n");
  });
  q("json").addEventListener("click", () => {
    download("iocs.json", "application/json", JSON.stringify(current, null, 2) + "\n");
  });

  render();
};
</script>
<script>
/* =====================================================================
   EMBEDDED TOOL: Log Sanitizer (https://github.com/ravigaming222/log-sanitizer)
   Logic is identical to the standalone log-sanitizer.html; only the UI is
   restyled and scoped to the card. Nothing here needs editing.
   ===================================================================== */

/* === LOGIC:START === */
const LS = (function () {
  'use strict';

  // ---------- Labels and protection against re-masking ----------
  // A value that is already one of our labels is never masked again.
  const LABEL_RE = /^(?:\[[A-Z][A-Z0-9_]*\]|[A-Z][A-Z0-9_]*_\d+|\*{3,}[^\s*]{0,4})$/;
  const ALIAS_TOKEN_RE = /\b[A-Z][A-Z0-9_]*_\d+\b/g;
  const PARTIAL_TYPES = new Set(['CARD', 'KEY', 'JWT', 'SECRET']);

  const DEFAULT_TYPES = {
    email: true, ipv4: true, ipv6: true, mac: true, jwt: true, keys: true,
    authhdr: true, kv: true, urlcreds: true, privkey: true, card: true,
    iban: true, phone: true,
    hosts: false, uuid: false, usernames: false, custom: false
  };

  // ---------- Validators ----------
  function luhnOk(digits) {
    if (!/^\d{13,19}$/.test(digits)) return false;
    let sum = 0, alt = false;
    for (let i = digits.length - 1; i >= 0; i--) {
      let d = digits.charCodeAt(i) - 48;
      if (alt) { d *= 2; if (d > 9) d -= 9; }
      sum += d; alt = !alt;
    }
    return sum % 10 === 0;
  }

  function ibanOk(s) {
    if (!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s)) return false;
    const r = s.slice(4) + s.slice(0, 4);
    let rem = 0;
    for (let i = 0; i < r.length; i++) {
      const c = r.charCodeAt(i);
      if (c >= 65) rem = (rem * 100 + (c - 55)) % 97;
      else rem = (rem * 10 + (c - 48)) % 97;
    }
    return rem === 1;
  }

  function ipv4Private(ip) {
    const p = ip.split('.').map(Number);
    return p[0] === 10 || p[0] === 127 || (p[0] === 192 && p[1] === 168) ||
      (p[0] === 172 && p[1] >= 16 && p[1] <= 31) || (p[0] === 169 && p[1] === 254);
  }

  function ipv6Ok(s) {
    if (!/^[0-9A-Fa-f:]+$/.test(s) || !/[0-9A-Fa-f]/.test(s) || s.includes(':::')) return false;
    const halves = s.split('::');
    if (halves.length > 2) return false;
    const groups = (p) => (p === '' ? [] : p.split(':'));
    const valid = (g) => g.every((x) => /^[0-9A-Fa-f]{1,4}$/.test(x));
    if (halves.length === 1) { const g = s.split(':'); return g.length === 8 && valid(g); }
    const a = groups(halves[0]), b = groups(halves[1]);
    return valid(a) && valid(b) && a.length + b.length <= 7;
  }

  function ipv6Private(s) {
    const l = s.toLowerCase();
    return l === '::1' || l === '::' || /^fe[89ab]/.test(l) || /^f[cd]/.test(l);
  }

  // ---------- Detectors ----------
  function scan(re, text, cb) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m[0].length === 0) { re.lastIndex++; continue; }
      cb(m);
    }
  }

  const RE = {
    privkey: /-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z0-9 ]*PRIVATE KEY-----/g,
    jwt: /(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]{2,}\.[A-Za-z0-9_-]+/g,
    keys: new RegExp('(?<![A-Za-z0-9_])(?:' + [
      '(?:AKIA|ASIA)[0-9A-Z]{16}',
      'github_pat_[A-Za-z0-9_]{22,255}',
      'gh[pousr]_[A-Za-z0-9]{20,255}',
      'xox[baprs]-[A-Za-z0-9-]{10,}',
      'AIza[0-9A-Za-z_-]{35}',
      '(?:sk|rk)_live_[0-9A-Za-z]{16,}',
      'npm_[A-Za-z0-9]{30,}',
      'glpat-[A-Za-z0-9_-]{20,}'
    ].join('|') + ')(?![A-Za-z0-9])', 'g'),
    authorization: /\bauthorization["']?[ \t]*[:=][ \t]*["']?(?:(?:Bearer|Basic|Negotiate|Token)[ \t]+)?([^\s"',;]+)/gid,
    apikeyHeader: /\bx-api-key["']?[ \t]*[:=][ \t]*["']?([^\s"',;]+)/gid,
    cookie: /\b(?:set-cookie|cookie)["']?[ \t]*:[ \t]*["']?([^\r\n"]*)/gid,
    kv: /(?<![A-Za-z0-9])(?:[A-Za-z0-9]{1,20}[_.-]){0,3}(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|client[_-]?secret|auth)(?:["']?[ \t]*[:=][ \t]*)("(?:[^"\\\r\n]|\\.)*"|'[^'\r\n]*'|\[[A-Z][A-Z0-9_]*\]|[^\s,;&"'}\]]+)/gid,
    urlcreds: /\b[A-Za-z][A-Za-z0-9+.-]*:\/\/([^\s:@\/?#]+):([^\s@\/?#]*)@/gd,
    card: /(?<![\d.])(?<!\d[ -])[2-6](?:[ -]?\d){12,18}(?!\d|\.\d)/g,
    iban: /(?<![A-Za-z0-9])[A-Z]{2}\d{2}(?: ?[A-Z0-9]{4}){2,7}(?: ?[A-Z0-9]{1,3})?(?![A-Za-z0-9])/g,

  const COOKIE_ATTRS = new Set(['path', 'domain', 'expires', 'max-age', 'samesite', 'secure', 'httponly', 'priority', 'partitioned']);

    } },

    { id: 'urlcreds', pri: 3, find(text, o, push) {

      scan(RE.apikeyHeader, text, (m) => push(m.indices[1][0], m.indices[1][1], 'SECRET'));

    { id: 'iban', pri: 5, find(text, o, push) {
      scan(RE.iban, text, (m) => {
        let cand = m[0];
        for (;;) {
          if (ibanOk(cand.replace(/ /g, ''))) { push(m.index, m.index + cand.length, 'IBAN'); return; }

    { id: 'email', pri: 6, find(text, o, push) {
      scan(RE.email, text, (m) => {

    { id: 'ipv4', pri: 7, find(text, o, push) {
      scan(RE.ipv4, text, (m) => {

    { id: 'ipv6', pri: 7, find(text, o, push) {

    { id: 'mac', pri: 7, find(text, o, push) {
      scan(RE.mac, text, (m) => push(m.index, m.index + m[0].length, 'MAC'));
    } },
    { id: 'phone', pri: 8, find(text, o, push) {
      scan(RE.phone, text, (m) => {

    { id: 'hosts', pri: 9, find(text, o, push) {
      scan(RE.hosts, text, (m) => push(m.index, m.index + m[0].length, 'HOST'));
    } },
    { id: 'uuid', pri: 9, find(text, o, push) {
      scan(RE.uuid, text, (m) => push(m.index, m.index + m[0].length, 'UUID'));
    } },
    { id: 'usernames', pri: 9, find(text, o, push) {
      scan(RE.userKv, text, (m) => push(m.indices[1][0], m.indices[1][1], 'USER'));

    { id: 'custom', pri: 9, find(text, o, push) {

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function buildCustom(lines) {

      const line = String(raw).trim();
      if (!line) continue;
      if (line.startsWith('re:')) {

  function createSession() {

  function aliasFor(session, type, value, used) {

  // ---------- Overlap resolution ----------
  // Priority first (lower wins), then length (longer wins), then position.
  function resolve(matches, length) {
    matches.sort((a, b) => (a.pri - b.pri) || ((b.e - b.s) - (a.e - a.s)) || (a.s - b.s));
    const cov = new Uint8Array(length);
    const accepted = [];
    for (const m of matches) {
      let clash = false;
      for (let i = m.s; i < m.e; i++) if (cov[i]) { clash = true; break; }
      if (clash) continue;
      cov.fill(1, m.s, m.e);
      accepted.push(m);
    }
    accepted.sort((a, b) => a.s - b.s);
    return accepted;

  function normalizeOpts(opts) {
    opts = opts || {};
    return {
      types: Object.assign({}, DEFAULT_TYPES, opts.types || {}),
      mode: opts.mode || 'type',
      skipPrivate: !!opts.skipPrivate,
      whitelist: (opts.whitelist || []).map((s) => String(s).trim()).filter(Boolean),
      custom: opts.custom || []

  }

  // ---------- Main function: single pass ----------
  function sanitize(text, opts, session) {
    const o = normalizeOpts(opts);
    session = session || createSession();
    const wl = new Set(o.whitelist);
    const matches = [];
    for (const d of DETECTORS) {
      if (!o.types[d.id]) continue;
      d.find(text, o, (s, e, type) => {
        if (e <= s) return;
        const v = text.slice(s, e);
        if (LABEL_RE.test(v)) return;
        matches.push({ s, e, type, pri: d.pri, keep: wl.has(v) });
      });

    const used = o.mode === 'pseudonyms' ? new Set(text.match(ALIAS_TOKEN_RE) || []) : null;

    const parts = [];
    const segments = [];
    const counts = Object.create(null);
    let pos = 0, outLen = 0, total = 0;
    for (const m of accepted) {
      if (m.s > pos) { const chunk = text.slice(pos, m.s); parts.push(chunk); outLen += chunk.length; }
      const orig = text.slice(m.s, m.e);
      let rep;
      if (m.keep) rep = orig;
      else {
        if (o.mode === 'pseudonyms') rep = aliasFor(session, m.type, orig, used);
        else if (o.mode === 'partial') rep = PARTIAL_TYPES.has(m.type) ? partialMask(orig, m.type) : '[' + m.type + ']';
        else if (o.mode === 'remove') rep = '[REDACTED]';
        else rep = '[' + m.type + ']';
        counts[m.type] = (counts[m.type] || 0) + 1;
        total++;
        segments.push({ s: outLen, e: outLen + rep.length, type: m.type });
      }
      parts.push(rep); outLen += rep.length;
      pos = m.e;
    }
    if (pos < text.length) parts.push(text.slice(pos));
    return { text: parts.join(''), counts, total, segments };
  }

  // ---------- Restore ----------
  function parseMap(map) {
    if (typeof map === 'string') {
      try { map = JSON.parse(map); } catch (e) { throw new Error('Mapping is not valid JSON'); }
    }
    if (!map || !Array.isArray(map.entries)) throw new Error('Mapping has no entries list');
    const rev = new Map();
    for (const en of map.entries) {
      if (en && typeof en.alias === 'string' && typeof en.original === 'string' && en.alias) rev.set(en.alias, en.original);
    }
    return rev;
  }

  // Substitute from the longest aliases to the shortest, in one pass.
  function restore(text, map) {
    const rev = map instanceof Map ? map : parseMap(map);
    if (!rev.size) return text;
    const aliases = Array.from(rev.keys()).sort((a, b) => b.length - a.length);
    const re = new RegExp(aliases.map(escapeRe).join('|'), 'g');
    return text.replace(re, (a) => rev.get(a));

        if (MODES.some((m) => m[0] === s.mode)) d.mode = s.mode;

  $('whitelist').addEventListener('input', () => schedule(false));
  $('custom').addEventListener('input', () => schedule(false));

  typeBoxes.addEventListener('change', (e) => {
    const t = e.target.dataset && e.target.dataset.type;
    if (!t) return;
    settings.types[t] = e.target.checked; saveSettings(); schedule(true);
  });
  modeBox.addEventListener('change', (e) => {
    if (e.target.name !== 'mode') return;
    settings.mode = e.target.value; saveSettings(); schedule(true);
  });
  $('opt-skip-private').addEventListener('change', (e) => { settings.skipPrivate = e.target.checked; saveSettings(); schedule(true); });
  $('opt-autopaste').addEventListener('change', (e) => { settings.autopaste = e.target.checked; saveSettings(); if (settings.autopaste) schedule(true); });
  $('opt-highlight').addEventListener('change', (e) => { settings.highlight = e.target.checked; saveSettings(); if ($('input').value) run(); });

  $('btn-clear').addEventListener('click', () => {
    clearTimeout(debounceTimer);
    $('input').value = ''; $('output').value = ''; $('output-view').textContent = '';
    $('output-view').hidden = true; $('output').hidden = false; $('highlight-note').hidden = true;
    lastOutput = ''; session = LS.createSession();
    $('stats').textContent = ''; updateMapInfo(); setStatus('Text and session mapping cleared');
  });
  $('btn-copy').addEventListener('click', () => copyText(lastOutput, $('status')));
  $('btn-txt').addEventListener('click', () => download('sanitized.txt', lastOutput, 'text/plain;charset=utf-8'));
  $('btn-sample').addEventListener('click', () => { $('input').value = sampleText(); run(); });
  $('btn-reset').addEventListener('click', () => {
    settings = defaults(); applySettingsToUI(); saveSettings(); schedule(true); setStatus('Settings reset');
  });
  $('btn-map').addEventListener('click', () => {
    if (!session.rev.size) { setStatus('Mapping is empty: choose "Pseudonyms" mode and process some text'); return; }
    download('log-sanitizer-map.json', JSON.stringify(LS.exportMap(session), null, 2), 'application/json');
  });

  // tabs
  function showTab(which) {
    const clean = which === 'clean';
    $('view-clean').hidden = !clean; $('view-restore').hidden = clean;
    $('tab-clean').setAttribute('aria-selected', String(clean));
    $('tab-restore').setAttribute('aria-selected', String(!clean));
  }
  $('tab-clean').addEventListener('click', () => showTab('clean'));
  $('tab-restore').addEventListener('click', () => showTab('restore'));

  // restore
  $('r-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { $('r-map').value = String(fr.result); $('r-status').textContent = 'Mapping loaded'; };
    fr.onerror = () => { $('r-status').textContent = 'Could not read the file'; };
    fr.readAsText(f);
    e.target.value = '';
  });
  $('r-run').addEventListener('click', () => {
    const err = $('r-error');
    err.hidden = true;
    try {
      const mapText = $('r-map').value.trim();
      const map = mapText ? mapText : LS.exportMap(session);
      $('r-output').value = LS.restore($('r-input').value, map);
      $('r-status').textContent = mapText ? 'Done' : 'Done (used the current session mapping)';
    } catch (e) {
      err.textContent = e.message; err.hidden = false; $('r-status').textContent = '';
    }
  });
  $('r-copy').addEventListener('click', () => copyText($('r-output').value, $('r-status')));

  loadSettings();
  applySettingsToUI();
  updateMapInfo();
};
/* === UI:END === */
</script>
